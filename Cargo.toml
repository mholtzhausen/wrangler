[package]
name = "wrangler"
version = "1.0.0"
edition = "2021"

[lib]
name = "wrangler"
path = "src/lib.rs"

[[bin]]
name = "wrangler"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
sysinfo = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
nix = { version = "0.29", features = ["signal", "process", "fs", "user"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-util = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "test-util"] }

